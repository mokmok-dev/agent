receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4318
      grpc:
        endpoint: 127.0.0.1:4317
exporters:
  # The daemon points `OTEL_EXPORTER_OTLP_ENDPOINT` at this collector; the debug
  # exporter prints each span to the collector's own stdout, which is enough to
  # see a trace without a separate backend. Point it at Jaeger or another OTLP
  # endpoint to view traces properly.
  debug:
    verbosity: detailed
service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [debug]
