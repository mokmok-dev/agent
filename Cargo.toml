[workspace]
members = ["agent", "agentd", "daemon", "sandbox"]
resolver = "3"

[workspace.dependencies]
# `pure` forces the portable Rust implementation and avoids all C code, which
# Kani's compiler cannot model (runtime CPU feature detection) or link.
# Revisit if the hashing cost matters.
blake3 = { version = "1.8.2", default-features = false, features = ["pure"] }
clap = { version = "4.6.6", features = ["derive"] }
# The `Stream`/`Sink` extension traits for the WebSocket transport. tokio-
# tungstenite already depends on it, so this only names the version.
futures-util = { version = "0.3.34", default-features = false, features = [
  "sink",
] }
proptest = "1.11.0"
# TLS for the agent's model client. `ring` is the crypto provider: it needs a C
# compiler, which the dev shell and the crane build both have, and it stays out
# of Kani's scope because only the `agent` crate is Kani-built.
rustls = { version = "0.23.45", default-features = false, features = [
  "ring",
  "std",
  "tls12",
] }
serde = { version = "1.0.228", features = ["derive"] }
# `anyhow` is for binaries only; every library here uses `thiserror`.
anyhow = "1.0.100"
serde_json = "1.0.145"
thiserror = "2.0.20"
time = { version = "0.3.44", features = ["serde-well-known"] }
# The settings file. Only `parse` and `serde` are enabled: `display` and the
# writer it pulls exist to *encode* TOML, which nothing here does.
toml = { version = "1.1.6", default-features = false, features = [
  "parse",
  "serde",
  "std",
] }
# Structured logging and spans. `tracing` alone has no build script and depends
# only on `tracing-core`, so it does not disturb the Kani `--lib` build. The
# subscriber that installs a global logger lives in the binary, not the library.
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
# The binary's log subscriber. Kept out of the library so the library does not
# install global state and the Kani unit graph stays small. `env-filter` pulls
# `regex-automata`; it is only reachable from the binary.
tracing-subscriber = { version = "0.3.23", features = [
  "env-filter",
  "fmt",
  "json",
] }
# `server` spawns a task per connection and uses `select!`, so it needs `rt`,
# `macros`, and `time`; the lower layers use only `sync`/`net`/`io-util` and
# stay runtime-agnostic. `rt-multi-thread` is what the `agent` binary runs on:
# a connection's `fsync` blocks its worker, so several workers are what keep one
# publish from stalling the others.
tokio = { version = "1.53.1", default-features = false, features = [
  "io-util",
  "macros",
  "net",
  "rt",
  "rt-multi-thread",
  "sync",
  "time",
] }
# The server side of the handshake and RFC 6455 framing. No TLS: the transport
# is a local Unix domain socket, and a remote client is expected to arrive
# through an external proxy.
tokio-tungstenite = { version = "0.30.0", default-features = false, features = [
  "handshake",
] }
ulid = "3.0.0"
# Secrets read from the environment (a provider key, a proxy token) are held in a
# wrapper that cannot be printed and is wiped when it drops; `zeroize` is named
# separately for the buffers that carry a secret on their way out.
secrecy = "0.10.3"
zeroize = "1.9.0"
# Mozilla's roots, compiled into the binary. The session's policy grants no CA
# file, so the client cannot read the system store; see `docs/session/agent.md`.
webpki-roots = "1.0.9"

[workspace.metadata.crane]
name = "agent"

# `cargo-kani` reads its flags from the workspace root manifest, not the member,
# so this must stay here or the unwind bound is silently ignored and CBMC runs
# effectively unbounded. The CRC table loop runs once per hashed byte (up to
# ~68 for the largest record the harnesses build), so the bound has to exceed
# that.
[workspace.metadata.kani.flags]
default-unwind = "80"
output-format = "terse"

[workspace.lints.clippy]
all = "deny"
expect_used = "deny"
nursery = "deny"
panic = "deny"
pedantic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[workspace.lints.rust]
future_incompatible = { level = "deny", priority = -1 }
missing_docs = "deny"
# `#[cfg(kani)]` harnesses are compiled by `cargo kani`, not `cargo test` or
# `cargo clippy`, so the cfg needs to be declared or every check warns. The
# group above has to sit at a lower priority so this specific lint wins.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
unsafe_code = "deny"
unused = { level = "deny", priority = -1 }

[workspace.package]
edition = "2024"
version = "0.0.0"
