[workspace]
members = [
  "crates/agentctl",
  "crates/agentd",
  "crates/core",
  "crates/model",
  "crates/prompt",
  "crates/removeme",
  "crates/runtime",
  "crates/store",
  "crates/wire",
  "crates/xtask",
]
resolver = "3"

[workspace.dependencies]
agent-core = { path = "crates/core" }
agent-model = { path = "crates/model" }
agent-prompt = { path = "crates/prompt" }
agent-runtime = { path = "crates/runtime" }
agent-store = { path = "crates/store" }
agent-wire = { path = "crates/wire" }
blake3 = { version = "1", default-features = false }
clap = { version = "4", default-features = false, features = [
  "derive",
  "error-context",
  "help",
  "std",
  "usage",
] }
rusqlite = "0.37"
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", default-features = false }
serde_json = { version = "1", features = ["raw_value"] }
serde_yaml_ng = "0.10"

[workspace.lints.clippy]
all = "warn"
doc_link_code = "warn"
expect_used = "warn"
missing_const_for_fn = "warn"
option_if_let_else = "warn"
panic = "warn"
pedantic = "warn"
redundant_clone = "warn"
redundant_pub_crate = "warn"
significant_drop_tightening = "warn"
suboptimal_flops = "warn"
todo = "warn"
unwrap_used = "warn"
use_self = "warn"

[workspace.lints.rust]
unexpected_cfgs = "warn"
unsafe_code = "deny"

[workspace.metadata.crane]
name = "agent"

[workspace.package]
edition = "2024"
version = "0.0.0"
