[workspace]
members = ["agentd"]
resolver = "3"

[workspace.dependencies]
axum = { version = "0.8.9" }
clap = { version = "4.6.6" }
thiserror = { version = "2.0.20" }
tokio = { version = "1.53.1" }
tower-http = { version = "0.7.1" }
tracing = { version = "0.1.44" }
tracing-subscriber = { version = "0.3.23" }

[workspace.lints.clippy]
all = "deny"
expect_used = "deny"
nursery = "deny"
panic = "deny"
pedantic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[workspace.lints.rust]
future_incompatible = "deny"
unsafe_code = "deny"
unused = "deny"

[workspace.metadata.crane]
name = "agent"

[workspace.package]
edition = "2024"
version = "0.0.0"
