[workspace]
members = ["agent"]
resolver = "3"

[workspace.dependencies]
# `pure` forces the portable Rust implementation and avoids all C code, which
# Kani's compiler cannot model (runtime CPU feature detection) or link.
# Revisit if the hashing cost matters.
blake3 = { version = "1.8.2", default-features = false, features = ["pure"] }
clap = { version = "4.6.6", features = ["derive"] }
# The `Stream`/`Sink` extension traits for the WebSocket transport. tokio-
# tungstenite already depends on it, so this only names the version.
futures-util = { version = "0.3.34", default-features = false, features = [
  "sink",
] }
proptest = "1.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.20"
time = { version = "0.3.44", features = ["serde-well-known"] }
# `server` spawns a task per connection and uses `select!`, so it needs `rt`,
# `macros`, and `time`; the lower layers use only `sync`/`net`/`io-util` and
# stay runtime-agnostic.
tokio = { version = "1.53.1", default-features = false, features = [
  "io-util",
  "macros",
  "net",
  "rt",
  "sync",
  "time",
] }
# The server side of the handshake and RFC 6455 framing. No TLS: the transport
# is a local Unix domain socket, and a remote client is expected to arrive
# through an external proxy.
tokio-tungstenite = { version = "0.30.0", default-features = false, features = [
  "handshake",
] }
ulid = "1.2.1"

[workspace.metadata.crane]
name = "agent"

# `cargo-kani` reads its flags from the workspace root manifest, not the member,
# so this must stay here or the unwind bound is silently ignored and CBMC runs
# effectively unbounded. The CRC table loop runs once per hashed byte (up to
# ~68 for the largest record the harnesses build), so the bound has to exceed
# that.
[workspace.metadata.kani.flags]
default-unwind = "80"
output-format = "terse"

[workspace.lints.clippy]
all = "deny"
expect_used = "deny"
nursery = "deny"
panic = "deny"
pedantic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[workspace.lints.rust]
future_incompatible = { level = "deny", priority = -1 }
missing_docs = "deny"
# `#[cfg(kani)]` harnesses are compiled by `cargo kani`, not `cargo test` or
# `cargo clippy`, so the cfg needs to be declared or every check warns. The
# group above has to sit at a lower priority so this specific lint wins.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
unsafe_code = "deny"
unused = { level = "deny", priority = -1 }

[workspace.package]
edition = "2024"
version = "0.0.0"
