[workspace]
members = ["agentd", "agentd-events", "integrations/sandbox"]
resolver = "3"

[workspace.dependencies]
agentd-events = { path = "agentd-events" }
agentd-integration-sandbox = { path = "integrations/sandbox" }
axum = { version = "0.8.9" }
clap = { version = "4.6.6" }
futures-util = { version = "0.3.34", features = ["sink"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151" }
thiserror = { version = "2.0.20" }
time = { version = "0.3.55", features = ["formatting", "parsing"] }
tokio = { version = "1.53.1" }
tower-http = { version = "0.7.1" }
tracing = { version = "0.1.44" }
tracing-subscriber = { version = "0.3.23" }
uuid = { version = "1.26.1", features = ["v7"] }

[workspace.lints.clippy]
all = "deny"
expect_used = "deny"
nursery = "deny"
panic = "deny"
pedantic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[workspace.lints.rust]
future_incompatible = "deny"
unsafe_code = "deny"
unused = "deny"

[workspace.metadata.crane]
name = "agent"

[workspace.package]
edition = "2024"
version = "0.0.0"
