[package]
edition.workspace = true
name = "agentd-client"
version.workspace = true

[dependencies]
agentd-events = { workspace = true }
agentd-node = { workspace = true }
agentd-telemetry = { workspace = true }
axum = { workspace = true, features = ["ws"] }
clap = { workspace = true, features = ["derive"] }
futures-util = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = [
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tracing = { workspace = true }

[dev-dependencies]
agentd = { path = "../agentd", default-features = false }
agentd-inference = { workspace = true }
tempfile = "3.27.0"
tokio = { workspace = true, features = [
  "macros",
  "net",
  "rt-multi-thread",
  "sync",
  "time",
] }
tokio-tungstenite = { workspace = true }

[lints]
workspace = true
