[package]
edition.workspace = true
name = "agent"
publish = false
version.workspace = true

[[bin]]
name = "verify"
path = "bins/verify.rs"

[[bin]]
name = "agent"
path = "bins/agent.rs"

[dependencies]
blake3.workspace = true
clap.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tracing.workspace = true
# Only the `agent` binary installs a subscriber; the library only emits events.
# It lives here rather than under `[dev-dependencies]` because cargo has no
# per-binary dependency section. It is pure Rust with no build script, so it does
# not break the Kani `--lib` build.
tracing-subscriber.workspace = true
ulid.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
