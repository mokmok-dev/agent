[package]
edition.workspace = true
name = "agent"
publish = false
version.workspace = true

[[bin]]
name = "verify"
path = "bins/verify.rs"

[dependencies]
blake3.workspace = true
clap.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true

[package.metadata.kani.flags]
# The CRC table loop runs once per byte, and a harness hashes a record of up to
# ~68 bytes, so the bound has to exceed that. Individual harnesses raise it
# further when they need to.
default-unwind = "80"
output-format = "terse"

[lints]
workspace = true
