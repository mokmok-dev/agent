[package]
edition.workspace = true
name = "agent"
publish = false
version.workspace = true

[[bin]]
name = "verify"
path = "bins/verify.rs"

[dependencies]
blake3.workspace = true
clap.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
ulid.workspace = true

[dev-dependencies]
proptest.workspace = true
# The multi-threaded runtime is test-only: production code needs only the
# single-threaded `rt` the `server` module spawns on, but tests want a
# multi-threaded one so blocking `Bus` calls do not starve the connection tasks.
tokio = { workspace = true, features = ["rt-multi-thread"] }

[lints]
workspace = true
