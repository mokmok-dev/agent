name = "agent-control-plane"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

[durable_objects]
bindings = [
  { name = "SESSIONS", class_name = "SessionDurableObject" },
  { name = "THREAD_INDEX", class_name = "ThreadIndexDurableObject" },
  { name = "LINEAR_OAUTH", class_name = "LinearOAuthDurableObject" },
  { name = "PROVIDERS", class_name = "ProviderCredentialDurableObject" },
]

# Every log and every trace, kept where the dashboard can query them. A webhook
# problem is visible only after the fact, so the full rate is the point. The
# query string is kept because the Linear callback's `code` and `state` are the
# evidence for a refused login.
[observability]
enabled = true
head_sampling_rate = 1

[observability.issues]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SessionDurableObject", "ThreadIndexDurableObject"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["LinearOAuthDurableObject"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["ProviderCredentialDurableObject"]

# The sandbox target runs an agent in a Container attached to the session
# object, which needs the Workers Paid plan.
[[containers]]
class_name = "SessionDurableObject"
scheduling_policy = "durable_object"

# Provider secrets, set with `wrangler secret put`:
#   SLACK_SIGNING_SECRET, SLACK_BOT_USER_ID, DISCORD_PUBLIC_KEY,
#   LINEAR_WEBHOOK_SECRET, LINEAR_CLIENT_ID, LINEAR_CLIENT_SECRET
#
# LINEAR_CLIENT_ID, LINEAR_CLIENT_SECRET, and LINEAR_REDIRECT_URI are plain
# vars because they are not secret, but the secret and the redirect must match
# the Linear OAuth application exactly.
[vars]
LINEAR_REDIRECT_URI = "https://agent-control-plane.mokmok.workers.dev/oauth/linear/callback"
# The models a turn may run. PI_PROVIDERS is a comma-separated list of pi-ai
# providers; PI_DEFAULT_MODEL is `provider:modelId`. A provider's key is a
# secret named after it, for example OPENAI_API_KEY or ANTHROPIC_API_KEY.
#
# `ollama-cloud` is this repository's own provider: it reaches Ollama's
# OpenAI-compatible endpoint at https://ollama.com/v1 with OLLAMA_API_KEY.
# Enable it with:
#   wrangler secret put OLLAMA_API_KEY
#   PI_PROVIDERS = "cloudflare-workers-ai,ollama-cloud"
#   PI_DEFAULT_MODEL = "ollama-cloud:gemma4:31b"
PI_PROVIDERS = "ollama-cloud"
PI_DEFAULT_MODEL = "ollama-cloud:deepseek-v4.1-flash"

# Where a turn runs. The local VM hosts the agent's own process, so a turn is
# handed to the gateway that serves it rather than run inside the Worker. A
# deployment that wants the sandbox states `cloudflare-sandbox` instead.
AGENT_DEFAULT = "claude-code"
AGENT_RUNTIMES = "local-vm"
AGENT_AVAILABLE_RUNTIMES = "local-vm"
