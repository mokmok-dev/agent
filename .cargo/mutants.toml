# Measurement conditions for cargo-mutants, shared by local runs and the PR job
# so both sides measure the same set.

# A `#[cfg(kani)]` harness is not compiled by `cargo test`, so a mutant inside
# one always reports a miss that no test can fix. Harness strength is checked by
# the harness-mutation derivations in flake.nix instead. The file is excluded
# rather than a regex on the function name, because a mutant's name is
# unqualified and would not carry the `proofs::` path.
exclude_globs = ["agent/src/wal/proofs.rs"]

# The daemon's real path over the sandbox's executor: `LaunchedProcess for
# Process` is a one-line pass-through to `Process::kill`, and the only code that
# calls it is `real_launcher.rs`, which spawns a real confined process. Every CI
# runner here forbids unprivileged user namespaces, so that test skips and the
# delegation cannot be reached; a replacement with `Ok(())` therefore survives.
# The test runs on a namespace-capable host, which is where the behavior is
# checked, so the survivor is a coverage gap of the CI host, not of the code.
#
# `recover_from` only ever compares from `position == 0` before incrementing it,
# so `position < bytes.len()` and `bytes.len() - position < HEADER_LEN` are both
# vacuously true on entry and never reached again. Changing `<` to any other
# operator on those two guards cannot change an outcome.
#
# The `effective > 0` guard in `Store::write_batch` skips a rotation when the
# open segment is empty. At `effective == 0` the store has just opened the
# segment for the record about to be written, so rotating would close and reopen
# the same `segment-{seq:020}.log` name; the guard's presence or absence is
# unobservable. The oversized-first-record test pins the intended layout anyway.
#
# `Tunnel::flush` delegates to a `TcpStream`, whose `flush` does nothing, and it
# is only ever reached after a `write` that has already applied the same deadline
# check. Replacing its body with `Ok(())` therefore cannot change an outcome.
exclude_re = [
  "replace < with .* in recover_from",
  "replace <impl LaunchedProcess for Process>::kill",
  "replace <impl Write for Tunnel>::flush",
  "replace > with >= in .*write_batch",
]
