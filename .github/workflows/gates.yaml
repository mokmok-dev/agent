name: gates
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  lockfile:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.0
      - run: gh actions-lock --verify
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: DeterminateSystems/nix-installer-action@v23
      - run: nix develop --command cargo xtask spec-check
  mutants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@v23
      - name: Mutation on the changed lines
        if: github.event_name == 'pull_request'
        run: |
          git diff "origin/${{ github.base_ref }}" > "$RUNNER_TEMP/pr.diff"
          wc -l "$RUNNER_TEMP/pr.diff"
          nix develop --command cargo mutants --in-diff "$RUNNER_TEMP/pr.diff"
      - name: Mutation over the workspace
        if: github.event_name != 'pull_request'
        run: nix develop --command cargo mutants --workspace
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: mutants
          path: mutants.out/
          if-no-files-found: ignore
