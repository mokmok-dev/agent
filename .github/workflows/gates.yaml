name: gates
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - run: nix develop --command cargo xtask spec-check
  mutants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Mutation on the changed lines
        if: github.event_name == 'pull_request'
        run: nix develop --command cargo mutants --in-diff "origin/${{ github.base_ref }}"
      - name: Mutation over the workspace
        if: github.event_name != 'pull_request'
        run: nix develop --command cargo mutants --workspace
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: mutants
          path: mutants.out/
          if-no-files-found: ignore
