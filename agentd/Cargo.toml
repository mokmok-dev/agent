[package]
edition.workspace = true
name = "agentd"
version.workspace = true

[features]
# On by default: the daemon's purpose is to supervise a confined agent, and
# `serve --session-command` and `up` both need it. `--no-default-features`
# still builds the slim daemon that serves the event API and `/inference`
# without any confinement.
default = ["sandbox"]
sandbox = ["dep:agentd-sandbox"]

[[example]]
name = "acp_handshake"
required-features = ["sandbox"]

[dependencies]
agentd-events = { workspace = true }
agentd-inference = { workspace = true, features = ["providers"] }
agentd-sandbox = { workspace = true, optional = true }
axum = { workspace = true, features = ["tracing", "ws"] }
base64 = { workspace = true }
clap = { workspace = true, features = ["derive"] }
futures-util = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = [
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tower-http = { workspace = true, features = ["trace"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
uuid = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
agentd-node = { workspace = true }
async-trait = "0.1.89"
rusqlite = { workspace = true }
tempfile = "3.27.0"
# `test-util` gives the pauseable clock the announce-timeout tests need, so
# they do not each wait the real bound.
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite = { workspace = true }
